<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Microcontroller Trace Grid -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="120" y1="40" x2="120" y2="110" />
    <line x1="180" y1="40" x2="180" y2="110" />
    <line x1="256" y1="40" x2="256" y2="110" />
    <line x1="332" y1="40" x2="332" y2="110" />
    <line x1="392" y1="40" x2="392" y2="110" />

    <line x1="120" y1="402" x2="120" y2="472" />
    <line x1="180" y1="402" x2="180" y2="472" />
    <line x1="256" y1="402" x2="256" y2="472" />
    <line x1="332" y1="402" x2="332" y2="472" />
    <line x1="392" y1="402" x2="392" y2="472" />

    <line x1="40" y1="120" x2="110" y2="120" />
    <line x1="40" y1="180" x2="110" y2="180" />
    <line x1="40" y1="256" x2="110" y2="256" />
    <line x1="40" y1="332" x2="110" y2="332" />
    <line x1="40" y1="392" x2="110" y2="392" />

    <line x1="402" y1="120" x2="472" y2="120" />
    <line x1="402" y1="180" x2="472" y2="180" />
    <line x1="402" y1="256" x2="472" y2="256" />
    <line x1="402" y1="332" x2="472" y2="332" />
    <line x1="402" y1="392" x2="472" y2="392" />
  </g>

  <!-- Central Chip Package -->
  <rect x="110" y="110" width="292" height="292" rx="42" fill="url(#chipGrad)" stroke="#60a5fa" stroke-width="6" filter="url(#glow)" />
  <rect x="134" y="134" width="244" height="244" rx="28" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="3" />

  <!-- Integrated Barcode & QR Glyphs inside Core -->
  <g fill="#38bdf8">
    <!-- QR Corner Anchor Top Left -->
    <rect x="160" y="160" width="46" height="46" rx="8" fill="#38bdf8" />
    <rect x="171" y="171" width="24" height="24" rx="4" fill="#0f172a" />
    <rect x="178" y="178" width="10" height="10" rx="2" fill="#38bdf8" />

    <!-- QR Corner Anchor Top Right -->
    <rect x="306" y="160" width="46" height="46" rx="8" fill="#38bdf8" />
    <rect x="317" y="171" width="24" height="24" rx="4" fill="#0f172a" />
    <rect x="324" y="178" width="10" height="10" rx="2" fill="#38bdf8" />

    <!-- QR Corner Anchor Bottom Left -->
    <rect x="160" y="306" width="46" height="46" rx="8" fill="#38bdf8" />
    <rect x="171" y="317" width="24" height="24" rx="4" fill="#0f172a" />
    <rect x="178" y="324" width="10" height="10" rx="2" fill="#38bdf8" />
  </g>

  <!-- Central Barcode Lines -->
  <g fill="#10b981">
    <rect x="228" y="160" width="6" height="46" rx="2" />
    <rect x="240" y="160" width="12" height="46" rx="3" />
    <rect x="260" y="160" width="8" height="46" rx="2" />
    <rect x="276" y="160" width="14" height="46" rx="3" />

    <!-- Center Pulse Waves -->
    <circle cx="256" cy="256" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="7" />
    <circle cx="256" cy="256" r="12" fill="#38bdf8" />

    <!-- Bottom Barcode Matrix -->
    <rect x="226" y="306" width="8" height="46" rx="2" />
    <rect x="242" y="306" width="14" height="46" rx="3" />
    <rect x="264" y="306" width="6" height="46" rx="2" />
    <rect x="278" y="306" width="12" height="46" rx="3" />
    <rect x="306" y="306" width="46" height="46" rx="10" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>